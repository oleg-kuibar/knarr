name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and run `npm publish --dry-run` only; skips the approval-gated publish job
        required: false
        type: boolean
        default: true

# Deny everything by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs all third-party dependency code (install, build, tests) WITHOUT any
  # publishing credential, and hands a verified tarball to the publish job.
  verify:
    name: verify release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in the release pipeline: a cache entry written by
          # another workflow could otherwise end up in the published package.

      - name: Check version and changelog
        id: release
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "knarr@${version}" version >/dev/null 2>&1; then
            echo "::error::knarr@${version} is already published. Bump package.json#version."
            exit 1
          fi
          awk -v heading="## ${version}" '$0 == heading { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## ${version}' section. Rename '## Unreleased' to '## ${version}'."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=low
      - run: pnpm lint
      - run: pnpm build

      - name: Build example packages
        run: |
          cd examples/packages/api-client && npm ci --ignore-scripts && npx --no-install tsup
          cd ../ui-kit && npm ci --ignore-scripts && npx --no-install tsup

      - run: pnpm test
      - run: node scripts/verify-pack.mjs

      - name: Pack
        id: pack
        run: |
          tarball="$(npm pack --ignore-scripts --silent)"
          sha256="$(sha256sum "$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball ($sha256)"

      - name: Publish dry run
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "./$TARBALL" --access public --dry-run

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # Holds the npm OIDC credential. Runs no repository or dependency code:
  # it only downloads the verified tarball and hands it to the npm CLI.
  publish:
    name: publish to npm
    needs: verify
    if: github.ref == 'refs/heads/master' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/knarr
    permissions:
      id-token: write # npm trusted publishing (OIDC) and provenance signing
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          digest-mismatch: error

      - name: Check tarball integrity
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: echo "${EXPECTED_SHA256}  ${TARBALL}" | sha256sum --check --strict

      - name: Publish
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
        # Trusted publishing: no token secret. --provenance links the package to this run.
        run: npm publish "./$TARBALL" --provenance --access public

  github-release:
    name: create GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the vX.Y.Z tag and release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          digest-mismatch: error

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file release-notes.md
