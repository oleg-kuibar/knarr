<title id="t">Knarr demo</title>
<desc id="d">In my-app, npx knarr use ../my-lib publishes my-lib and copies it into node_modules. In my-lib, npx knarr dev builds, pushes, and watches src; saving a file rebuilds and pushes the change to my-app.</desc>
